# D-01 门禁先行：全量静态门禁 + 测试（DESIGN §9.3 ci.yml 口径）
# rustfmt/clippy/cargo test 走 Windows runner（win-integration 等 crate 为 windows-cfg 代码）；
# 前端门禁（tsc/ESLint/Vitest）平台无关，走 ubuntu 提速。
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # D-27：基准矩阵必须随代码演进保持可编译（仅构建不执行，判定阈值在 tests/perf_thresholds.rs）
      - name: bench compile check
        run: cargo bench --workspace --no-run
      # P-01/P-02/P-03/P-09/SEC-07/STD-10 源码范式断言 + P-12 文档一致性（GOV-02 批次落地；本机 2026-09-25 双零实测）
      - name: pattern assertions (P-01/P-02/P-03/P-09/SEC-07/STD-10)
        shell: pwsh
        run: ./tools/assert-patterns.ps1
      - name: docs consistency (P-12)
        shell: pwsh
        run: ./tools/check-docs-consistency.ps1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: eslint
        run: npm run lint
      - name: vitest
        run: npm run test
      # GOV-02：运行时依赖漏洞审计收严为阻断（本机 2026-09-25 实跑 exit 0；
      # dev 工具链 vitest/esbuild 三条 advisory 需 vitest@5/vite@8 大版本迁移，挂账 D-35）
      - name: npm audit (runtime, blocking)
        run: npm audit --omit=dev --audit-level=high
      # PERF-03 产物体积预算（D-38 R-J3；预算表与基线实测见 tools/check-bundle-size.mjs）
      - name: bundle size budget
        run: npm run build && node tools/check-bundle-size.mjs

  # GOV-02：许可合规 + RUSTSEC 已知漏洞审计（deny.toml 是唯一策略源）
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
