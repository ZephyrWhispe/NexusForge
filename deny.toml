# GOV-02：许可合规与已知漏洞审计的自动化门禁（THIRD_PARTY_LICENSES.md 声明的
# "cargo-deny 复核"由此落地）。CI 侧 `cargo deny check`（见 ci.yml）。

[graph]
# 私有依赖 全部为本仓 workspace 内 crate；all-features 以覆盖条件编译面
all-features = true

[licenses]
version = 2
# 允许清单：与 THIRD_PARTY_LICENSES.md 保持同源（MIT/Apache-2.0/BSD/ISC/Unicode/Zlib/MPL-2.0）
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # GOV-02 实测接线：本仓 18 个第一方 crate 继承 root 的 GPL-3.0-only（LICENSE 在库根）
    "GPL-3.0-only",
]
# 置信度阈值：低置信度的 license 判定按未许可处理（宁可红不可漏）
confidence-threshold = 0.93
exceptions = []

[bans]
# 重复版本：只记日志不阻断（依赖树历史上存在多版本共存；收紧须先清树）
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# 只对本仓直接依赖（workspace）告警未维护项，传递依赖降噪
unmaintained = "workspace"
yanked = "deny"
# GOV-02 实测首轮命中 22 条（2026-09-25，本机 advisory-db 快照 593df8c 实跑）。
# 全部属"跨 API 依赖升级立项"，逐条挂账 DECISIONS D-35，禁止无理由 ignore：
#   wasmtime 18 条 → D-36 R-H1 已消解（29→36 LTS，ignore 行随批删除，deny 复绿为验收）
#   russh 2 条 → D-36 R-H2 已消解（0.46→0.63.3，ignore 行随批删除）；ed25519-dalek 1.x
#     源随升级消失（现 russh 直依 dalek 3.0.0，无通告命中）
#   RUSTSEC-2023-0071 挂账换形（D-36 R-H2 实测）：db 现值指向 rsa 0.10.0-rc.18
#     （Marvin 计时侧信道，上游 patched=[] 无安全升级位）。摘除需砍 russh "rsa"
#     feature＝砍用户 id_rsa 认证能力，属功能裁决待用户；桌面客户端本地用
#     +TOFU 钉服模型下威胁面收窄（恶意服务端观测签名时序）。
#   lopdf 1 条 → D-36 R-H3 已消解（0.36→0.45 零 API 漂移，ignore 行随批删除）
# 立项落地即删对应行；期间新增漏洞仍会照常报红（只 ignore 已登记 ID）。
ignore = [
    # --- 换形挂账（D-36 R-H2 登记，威胁面与处置见上方注释）---
    { id = "RUSTSEC-2023-0071", reason = "D-36 R-H2 换形挂账：rsa 0.10.0-rc.18 Marvin 计时侧信道，上游 patched=[] 无安全升级位；摘除=砍 RSA 认证能力属功能裁决待用户" },
]
