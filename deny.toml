# GOV-02：许可合规与已知漏洞审计的自动化门禁（THIRD_PARTY_LICENSES.md 声明的
# "cargo-deny 复核"由此落地）。CI 侧 `cargo deny check`（见 ci.yml）。

[graph]
# 私有依赖 全部为本仓 workspace 内 crate；all-features 以覆盖条件编译面
all-features = true

[licenses]
version = 2
# 允许清单：与 THIRD_PARTY_LICENSES.md 保持同源（MIT/Apache-2.0/BSD/ISC/Unicode/Zlib/MPL-2.0）
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # GOV-02 实测接线：本仓 18 个第一方 crate 继承 root 的 GPL-3.0-only（LICENSE 在库根）
    "GPL-3.0-only",
]
# 置信度阈值：低置信度的 license 判定按未许可处理（宁可红不可漏）
confidence-threshold = 0.93
exceptions = []

[bans]
# 重复版本：只记日志不阻断（依赖树历史上存在多版本共存；收紧须先清树）
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# 只对本仓直接依赖（workspace）告警未维护项，传递依赖降噪
unmaintained = "workspace"
yanked = "deny"
# GOV-02 实测首轮命中 22 条（2026-09-25，本机 advisory-db 快照 593df8c 实跑）。
# 全部属"跨 API 依赖升级立项"，逐条挂账 DECISIONS D-35，禁止无理由 ignore：
#   wasmtime 18 条 → automation-core 宿主面升级立项（29 线无补丁位，须迁 24 LTS 或 ≥36）
#   russh 2 条 + ed25519-dalek 1 条 → term/file-core SSH 栈升级立项（0.46→≥0.60）
#   lopdf 1 条 → editor-core 升级立项（0.36→≥0.42）
# 立项落地即删对应行；期间新增漏洞仍会照常报红（只 ignore 已登记 ID）。
ignore = [
    # --- wasmtime（D-35 挂账 ①）---
    { id = "RUSTSEC-2025-0046", reason = "D-35 挂账：wasmtime 29→24 LTS/≥36 升级立项" },
