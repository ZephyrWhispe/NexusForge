[workspace]
resolver = "2"
members = ["src-tauri", "crates/host-core", "crates/win-integration", "crates/clipboard-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZephyrWhispe"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
zeroize = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"

# 发布配置（docs/impl/07 PERF2，阶段四启用前先保持默认可调试）
[profile.dev]
opt-level = 0

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
