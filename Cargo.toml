[workspace]
resolver = "2"
members = ["src-tauri", "crates/host-core", "crates/win-integration", "crates/clipboard-core", "crates/screenshot-core", "crates/ocr-core", "crates/kvm-core", "crates/vault-core", "crates/file-core", "crates/proxy-core", "crates/desktop-core", "crates/editor-core", "crates/notes-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZephyrWhispe"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
zeroize = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# file-core（docs/impl/05 F1–F7）
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# proxy-core（docs/impl/05 PR1–PR6）：订阅拉取 / Sidecar 下载（rustls 避免系统代理劫持自身）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
# kvm-core（docs/impl/05 K1–K7）
socket2 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"

# vault-core（docs/impl/05 V1–V6）
argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"

# editor-core（docs/impl/06 E1–E4）：编码检测 + 纯 Rust PDF（qpdf/mutool sidecar 偏离，见 pdf.rs 注释）
encoding_rs = "0.8"
chardetng = "0.1"
lopdf = { version = "0.36", default-features = false }

# 发布配置（docs/impl/07 PERF2，阶段四启用前先保持默认可调试）
[profile.dev]
opt-level = 0

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
