[workspace]
resolver = "2"
members = ["src-tauri", "crates/host-core", "crates/win-integration", "crates/nexusforge-helper", "crates/clipboard-core", "crates/screenshot-core", "crates/ocr-core", "crates/kvm-core", "crates/vault-core", "crates/file-core", "crates/proxy-core", "crates/desktop-core", "crates/editor-core", "crates/notes-core", "crates/term-core", "crates/sys-core", "crates/automation-core", "crates/sync-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZephyrWhispe"]
license = "GPL-3.0"
# GOV-06：MSRV 机器可判（DESIGN 声称 Rust 1.80+；CI 锁 stable，本值是下限不是追踪目标）
rust-version = "1.80"

# GOV-06：跨 crate lint 统一（各 crate 可 [lints] workspace = true 继承）
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# 项目主线纪律：错误必须可传播（COR-29：生产路径 expect/unwrap 打断 worker）
unwrap_used = "allow"        # 分步收紧：先挂账计数，逐 crate 豁免后翻 deny
expect_used = "allow"
# 历史缺陷高发形：吞错、伪 static、误用语义
redundant_clone = "warn"
verbose_file_reads = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
zeroize = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# D-15：全局锁策略（parking_lot 无 poison 语义）+ 钩子回调无锁快照
parking_lot = "0.12"
arc-swap = "1"

# file-core（docs/impl/05 F1–F7）
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# B6 T-B6-3：WebDAV PROPFIND XML（reader-only，无 macro；经 plist 已在 Cargo.lock 内，零新包）
quick-xml = { version = "0.42", default-features = false }

# proxy-core（docs/impl/05 PR1–PR6）：订阅拉取 / Sidecar 下载（rustls 避免系统代理劫持自身）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
# kvm-core（docs/impl/05 K1–K7）
socket2 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"

# vault-core（docs/impl/05 V1–V6）
argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"

# editor-core（docs/impl/06 E1–E4）：编码检测 + 纯 Rust PDF（qpdf/mutool sidecar 偏离，见 pdf.rs 注释）
encoding_rs = "0.8"
chardetng = "0.1"
lopdf = { version = "0.36", default-features = false }

# automation-core（docs/impl/07 A5）：WASM 插件沙箱（fuel + 内存限额；wat feature 供测试直接写 wat 样本）
wasmtime = { version = "29", default-features = false, features = ["cranelift", "runtime", "wat"] }

# D-27：性能基准（DESIGN §9.1/§9.2 阈值断言与 criterion 基准矩阵）
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# D-28：security_config.rs 需要解析 permissions/*.toml
toml = "0.8"

# 发布配置（docs/impl/07 PERF2，阶段四启用前先保持默认可调试）
[profile.dev]
opt-level = 0
# 只保留回溯行号表（全量调试信息曾把 target\debug\deps 推到 44GB，C 盘吃紧）
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
