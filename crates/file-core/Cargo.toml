[package]
name = "file-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "文件与存储模块核心（docs/impl/05 F1–F7）：浏览/操作队列/冲突/预览/搜索/驱动/重命名"

[dependencies]
parking_lot = { workspace = true }
host-core = { path = "../host-core", version = "0.1.0" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
regex.workspace = true
base64.workspace = true
sha2.workspace = true
image.workspace = true
walkdir.workspace = true
zip.workspace = true
# B6 远端面（09 §6.2 T-B6-3）：两枚均为已锁包（reqwest 经 proxy-core、quick-xml 经 plist 在 Cargo.lock）
reqwest = { workspace = true }
quick-xml = { workspace = true }
zeroize = { workspace = true }
# B6 T-B6-5（09 §6.2）：SFTP 腿三枚全部沿用 term-core 的已锁版本字面量（零新包，
# "两份 SSH 栈"的重复成本按承重⑫ 在此显式登记）
russh = "0.46"
russh-sftp = "2"
async-trait = "0.1"
