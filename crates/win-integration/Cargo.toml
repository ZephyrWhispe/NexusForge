[package]
name = "win-integration"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Windows 原生能力适配层：全仓库唯一允许依赖 windows crate 的位置（DESIGN O2）"

[dependencies]
host-core = { path = "../host-core" }

[dependencies.windows]
version = "0.58"
features = [
    # 系统强调色：DwmGetColorizationColor
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    # WNDCLASSW/RegisterClassW 依赖 HBRUSH（Gdi feature）
    "Win32_Graphics_Gdi",
    # 剪贴板（docs/impl/02 C3）
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # DPAPI（docs/impl/02 C4）
    "Win32_Security_Cryptography",
    # 全局快捷键（docs/UI-PLAN.md U2-4）
    "Win32_UI_Input_KeyboardAndMouse",
    # 来源应用识别（GetClipboardOwner → 进程名）
    "Win32_System_Threading",
]
