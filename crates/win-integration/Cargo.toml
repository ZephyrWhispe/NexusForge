[package]
name = "win-integration"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Windows 原生能力适配层：全仓库唯一允许依赖 windows crate 的位置（DESIGN O2）"

[dependencies]
host-core = { path = "../host-core" }
tracing.workspace = true
# PNG → DIB（剪贴板图片回写，Port 契约：png 由本层转系统格式）
image.workspace = true

[dependencies.windows]
version = "0.58"
features = [
    # 系统强调色：DwmGetColorizationColor
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    # WNDCLASSW/RegisterClassW 依赖 HBRUSH（Gdi feature）
    "Win32_Graphics_Gdi",
    # 剪贴板（docs/impl/02 C3）
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Shell 缩略图/回收站（file-core F4/F2）+ USN 索引（F5）
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    # DPAPI（docs/impl/02 C4）
    "Win32_Security_Cryptography",
    # 全局快捷键（docs/UI-PLAN.md U2-4）
    "Win32_UI_Input_KeyboardAndMouse",
    # 来源应用识别（GetClipboardOwner → 进程名）
    "Win32_System_Threading",
    # WinRT 异步（IAsyncOperation::get）
    "Foundation",
    # Windows.Media.Ocr（docs/impl/04 O2）
    "Media_Ocr",
    # Language（BCP-47）
    "Globalization",
    # SoftwareBitmap
    "Graphics_Imaging",
    # CryptographicBuffer（BGRA → IBuffer）
    "Security_Cryptography",
    # IBuffer（OCR 像素缓冲）/ CreateCopyFromBuffer
    "Storage_Streams",
    # AvailableRecognizerLanguages 返回 IVectorView<Language>
    "Foundation_Collections",
    # PrintWindow 被 Windows 元数据归入 Storage.Xps（windows 0.58 已知归置）
    "Win32_Storage_Xps",
]
