# D-28：app 命令 ACL（tauri 2 中应用自定义权限文件一经定义即进入全量 ACL 强制——默认全拒，capabilities 显式白名单）。

[[permission]]
identifier = "allow-pdf-info"
description = "允许前端调用 pdf_info 命令（D-28 按窗最小授权）"
commands.allow = ["pdf_info"]

[[permission]]
identifier = "allow-pdf-merge"
description = "允许前端调用 pdf_merge 命令（D-28 按窗最小授权）"
commands.allow = ["pdf_merge"]

[[permission]]
identifier = "allow-pdf-split"
description = "允许前端调用 pdf_split 命令（D-28 按窗最小授权）"
commands.allow = ["pdf_split"]

[[permission]]
identifier = "allow-pdf-compress"
description = "允许前端调用 pdf_compress 命令（D-28 按窗最小授权）"
commands.allow = ["pdf_compress"]

[[permission]]
identifier = "allow-pdf-watermark"
description = "允许前端调用 pdf_watermark 命令（D-28 按窗最小授权）"
commands.allow = ["pdf_watermark"]
