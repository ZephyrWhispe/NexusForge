# D-28：app 命令 ACL（tauri 2 中应用自定义权限文件一经定义即进入全量 ACL 强制——默认全拒，capabilities 显式白名单）。

[[permission]]
identifier = "allow-ocr-recognize"
description = "允许前端调用 ocr_recognize 命令（D-28 按窗最小授权）"
commands.allow = ["ocr_recognize"]

[[permission]]
identifier = "allow-ocr-engine-status"
description = "允许前端调用 ocr_engine_status 命令（D-28 按窗最小授权）"
commands.allow = ["ocr_engine_status"]

[[permission]]
identifier = "allow-ocr-copy-text"
description = "允许前端调用 ocr_copy_text 命令（D-28 按窗最小授权）"
commands.allow = ["ocr_copy_text"]
