[[permission]]
identifier = "allow-screenshot-upload"
description = "允许前端把某条历史截图上传到已注册端点（D-29 §9.1-⑩：凭据为逐调用参数、永不落盘；仅主窗口）"
commands.allow = ["screenshot_upload"]
