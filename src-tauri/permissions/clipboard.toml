# D-28：app 命令 ACL（tauri 2 中应用自定义权限文件一经定义即进入全量 ACL 强制——默认全拒，capabilities 显式白名单）。

[[permission]]
identifier = "allow-clipboard-search"
description = "允许前端调用 clipboard_search 命令（D-28 按窗最小授权）"
commands.allow = ["clipboard_search"]

[[permission]]
identifier = "allow-clipboard-get"
description = "允许前端调用 clipboard_get 命令（D-28 按窗最小授权；T-B3-5 起敏感行由 CLIPBOARD_GET_001 拒绝）"
commands.allow = ["clipboard_get"]

