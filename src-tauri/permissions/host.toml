# D-28：app 命令 ACL（tauri 2 中应用自定义权限文件一经定义即进入全量 ACL 强制——默认全拒，capabilities 显式白名单）。

[[permission]]
identifier = "allow-host-system-accent"
description = "允许前端调用 host_system_accent 命令（D-28 按窗最小授权）"
commands.allow = ["host_system_accent"]

[[permission]]
identifier = "allow-host-capabilities"
description = "允许前端调用 host_capabilities 命令（COR-26：Mica 能力探测，只读）"
commands.allow = ["host_capabilities"]

