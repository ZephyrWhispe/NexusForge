# D-28：app 命令 ACL（tauri 2 中应用自定义权限文件一经定义即进入全量 ACL 强制——默认全拒，capabilities 显式白名单）。

[[permission]]
identifier = "allow-desktop-launcher-search"
description = "允许前端调用 desktop_launcher_search 命令（D-28 按窗最小授权）"
commands.allow = ["desktop_launcher_search"]

