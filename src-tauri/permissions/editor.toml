# D-28：app 命令 ACL（tauri 2 中应用自定义权限文件一经定义即进入全量 ACL 强制——默认全拒，capabilities 显式白名单）。

[[permission]]
identifier = "allow-editor-open"
description = "允许前端调用 editor_open 命令（D-28 按窗最小授权）"
commands.allow = ["editor_open"]

