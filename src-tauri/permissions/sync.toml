# D-28：app 命令 ACL（tauri 2 中应用自定义权限文件一经定义即进入全量 ACL 强制——默认全拒，capabilities 显式白名单）。

[[permission]]
identifier = "allow-sync-peers"
description = "允许前端调用 sync_peers 命令（D-28 按窗最小授权）"
commands.allow = ["sync_peers"]

[[permission]]
identifier = "allow-sync-status"
description = "允许前端调用 sync_status 命令（D-28 按窗最小授权）"
commands.allow = ["sync_status"]

[[permission]]
identifier = "allow-sync-now"
description = "允许前端调用 sync_now 命令（D-28 按窗最小授权）"
commands.allow = ["sync_now"]

[[permission]]
identifier = "allow-sync-conflicts-get"
description = "允许前端调用 sync_conflicts_get 命令（冲突历史分页读；D-28 按窗最小授权）"
commands.allow = ["sync_conflicts_get"]

[[permission]]
identifier = "allow-sync-conflict-restore"
description = "允许前端调用 sync_conflict_restore 命令（以本地留存快照重新生效并推送；D-28 按窗最小授权）"
commands.allow = ["sync_conflict_restore"]

[[permission]]
identifier = "allow-sync-runs-get"
description = "允许前端调用 sync_runs_get 命令（同步活动流水读，含失败行；D-28 按窗最小授权）"
commands.allow = ["sync_runs_get"]

[[permission]]
identifier = "allow-sync-datasets-get"
description = "允许前端调用 sync_datasets_get 命令（数据集在册表只读：白名单成员 + 是否已装应用器；D-28 按窗最小授权）"
commands.allow = ["sync_datasets_get"]

[[permission]]
identifier = "allow-sync-set-paused"
description = "允许前端调用 sync_set_paused 命令（暂停/恢复自动出账，写的是内核那一枚暂停位；D-28 按窗最小授权）"
commands.allow = ["sync_set_paused"]
