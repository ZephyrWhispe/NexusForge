[package]
name = "nexusforge"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "NexusForge 桌面应用（Tauri 2 壳）"

[lib]
name = "nexusforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
host-core = { path = "../crates/host-core" }
win-integration = { path = "../crates/win-integration" }
clipboard-core = { path = "../crates/clipboard-core" }
screenshot-core = { path = "../crates/screenshot-core" }
ocr-core = { path = "../crates/ocr-core" }
kvm-core = { path = "../crates/kvm-core" }
vault-core = { path = "../crates/vault-core" }
file-core = { path = "../crates/file-core" }
proxy-core = { path = "../crates/proxy-core" }
desktop-core = { path = "../crates/desktop-core" }
editor-core = { path = "../crates/editor-core" }
notes-core = { path = "../crates/notes-core" }
term-core = { path = "../crates/term-core" }
sys-core = { path = "../crates/sys-core" }
base64.workspace = true
